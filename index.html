<!DOCTYPE html>
<html lang="eu">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Aste honetako erosketa</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<main>

    <!-- ======================================
         CABECERA
    ======================================= -->

    <header class="cabecera">

        <div class="etiqueta">
            ASTEKO PLANA
        </div>

        <h1>
            Datorren asteko<br>
            erosketa
        </h1>

        <div
            id="usuarioActual"
            class="usuario"
        >
            Ez duzu saiorik hasi
        </div>

        <button
            id="loginGoogle"
            class="login-btn"
        >
            Google-rekin sartu
        </button>

    </header>


    <!-- ======================================
         ASTEA
    ======================================= -->

    <section class="astea">

        <p>
            Abuztuaren 17tik 23ra
        </p>

    </section>


    <!-- ======================================
         PRODUKTUAK
    ======================================= -->

    <section>

        <div class="titulo-seccion">

            <div>

                <span class="mini-etiqueta">
                    EROSKETA
                </span>

                <h2>
                    Erosketak
                </h2>

            </div>

            <span class="produktu-kopurua" id="produktuKopurua">
                0
            </span>

        </div>


        <!-- KATEGORIAK JS-REN BIDEZ SORTUKO DIRA -->

        <div id="kategoriak"></div>

    </section>


    <!-- ======================================
         NIRE ZERRENDA
    ======================================= -->

    <section class="nire-zerrenda-section">

        <div class="titulo-seccion">

            <div>

                <span class="mini-etiqueta">
                    EROSKETA ZERRENDA
                </span>

                <h2>
                    Nire zerrenda
                </h2>

            </div>

        </div>


        <div id="miLista"></div>


        <div
            id="zerrendaHutsa"
            class="zerrenda-hutsa"
        >

            <span>🛒</span>

            <p>
                Oraindik ez duzu ezer gehitu.
            </p>

        </div>


        <!-- ==================================
             EROSKETA EGINDA
        =================================== -->

        <button
            id="compraHecha"
            class="erosketa-eginda"
        >

            ✓ Erosketa eginda

        </button>

    </section>


</main>


<!-- ==========================================
     MODALA
=========================================== -->

<div
    id="confirmModal"
    class="modal-overlay"
>

    <div class="modal">

        <div class="modal-icon">
            🛒
        </div>

        <h2>
            Erosketa eginda dago?
        </h2>

        <p>
            Zerrenda guztia ezabatu nahi duzu?
        </p>

        <div class="modal-botoiak">

            <button
                id="modalEz"
                class="modal-ez"
            >
                Ez
            </button>

            <button
                id="modalBai"
                class="modal-bai"
            >
                Bai, ezabatu
            </button>

        </div>

    </div>

</div>


<!-- ==========================================
     JAVASCRIPT
=========================================== -->

<script
    type="module"
    src="script.js"
></script>


</body>

</html>
