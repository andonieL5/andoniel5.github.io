<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Compra de la semana</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <p>PLAN SEMANAL</p>

        <h1>
            Compra de la semana<br>
            que viene
        </h1>

        <!-- LOGIN -->
        <button id="loginGoogle">
            Continuar con Google
        </button>

        <p id="usuarioActual"></p>

        <p>
            Semana del 20 de julio al 26 de julio
        </p>

        <button id="compraHecha">
            Compra hecha
        </button>


        <!-- PRODUCTOS HABITUALES -->

        <h2>PRODUCTOS HABITUALES</h2>

        <p>
            Toca para añadirlos al momento.
        </p>


        <!-- QUESO -->

        <div class="producto">

            <span>🧀</span>

            <p>Queso Philadelphia</p>

            <button
                class="anadir"
                data-producto="Queso Philadelphia"
                data-emoji="🧀">
                +
            </button>

        </div>


        <!-- TOMATE -->

        <div class="producto">

            <span>🍅</span>

            <p>Tomate</p>

            <button
                class="anadir"
                data-producto="Tomate"
                data-emoji="🍅">
                +
            </button>

        </div>


        <!-- AGUACATE -->

        <div class="producto">

            <span>🥑</span>

            <p>Aguacate</p>

            <button
                class="anadir"
                data-producto="Aguacate"
                data-emoji="🥑">
                +
            </button>

        </div>


        <!-- LECHE -->

        <div class="producto">

            <span>🥛</span>

            <p>Leche</p>

            <button
                class="anadir"
                data-producto="Leche"
                data-emoji="🥛">
                +
            </button>

        </div>


        <!-- PAN -->

        <div class="producto">

            <span>🍞</span>

            <p>Pan</p>

            <button
                class="anadir"
                data-producto="Pan"
                data-emoji="🍞">
                +
            </button>

        </div>


        <!-- MI LISTA -->

        <h2>MI LISTA</h2>

        <ul id="miLista"></ul>

    </main>


    <!-- JAVASCRIPT -->

    <script type="module" src="script.js"></script>

</body>

</html>
